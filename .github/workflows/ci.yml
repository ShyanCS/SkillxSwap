name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs, e.g. to refresh the CVE scan without touching code.
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Testcontainers starts a real PostgreSQL container, so the runner's
      # Docker daemon does the heavy lifting here. ubuntu-latest ships with it.
      - name: Build and test
        working-directory: backend-java
        run: ./mvnw -B verify

      # Explicit migration gate, separate from verify: a scratch Postgres
      # gets the full chain applied from empty, then Flyway validates
      # checksums. Catches broken/duplicated versions and edited history
      # even when entity validation in the test suite happens to pass.
      - name: Flyway migration integrity
        working-directory: backend-java
        run: |
          docker run -d --name flyway-check \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=flyway_check \
            -p 55432:5432 postgres:16
          until docker exec flyway-check pg_isready -U postgres -d flyway_check >/dev/null 2>&1; do sleep 1; done
          ./mvnw -B -Duser.timezone=UTC \
            org.flywaydb:flyway-maven-plugin:11.7.2:migrate \
            org.flywaydb:flyway-maven-plugin:11.7.2:validate \
            -Dflyway.url=jdbc:postgresql://localhost:55432/flyway_check \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres
          docker rm -f flyway-check

      # CVE scan of the Maven classpath against NVD (keyed, cached).
      # The OSS Index analyzer is disabled: its anonymous tier is
      # rate-limited per source IP and GitHub runners share theirs, so it
      # 401s unreliably and fails the whole scan -- NVD is the authority
      # here. Blocking: a CVSS 9+ finding fails the build.
      #
      # dataDirectory is pinned explicitly because the plugin's default
      # does not match any stable home-relative path -- without this the
      # cache step silently saved nothing.
      - name: Restore OWASP NVD cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/odc-data
          # New key per run so refreshed advisories persist; restore-keys
          # picks up the newest previous corpus instead of cold-starting.
          key: odc-nvd-${{ github.run_id }}
          restore-keys: |
            odc-nvd-
      - name: OWASP dependency check
        working-directory: backend-java
        run: >-
          ./mvnw -B org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=9
          -DnvdApiKey="$NVD_API_KEY"
          -DdataDirectory="$HOME/.cache/odc-data"
          -Danalyzer.ossindex.enabled=false
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Save OWASP NVD cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/odc-data
          key: odc-nvd-${{ github.run_id }}

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results
          path: backend-java/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend-java/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: a compromised transitive dependency's install script
      # is a real supply-chain vector. Verified safe by running the build with
      # scripts disabled before adding this -- esbuild has a postinstall entry
      # but the platform binary still resolves via npm's own optionalDependency
      # mechanism without it.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # Gate on critical: the one known high (esbuild dev-server advisory via
      # vite) is documented in package.json history and only affects exposed
      # dev servers. Highs still appear in the log output above the gate.
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test (with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    # Only worth burning minutes on if the code itself is sound.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build only (no push): proves the Dockerfiles still work before a deploy
      # depends on them.
      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend-java
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_BASE_URL=https://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
