# Local development only. Every value here is a convenience default so the app
# runs against the docker-compose stack with zero configuration.
# Nothing in this file is used when SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/skillswap}
    username: ${DB_USERNAME:skillswap}
    password: ${DB_PASSWORD:skillswap}

  jpa:
    properties:
      hibernate:
        format_sql: true

  mail:
    # Points at the Mailpit container in docker-compose.yml (no auth, no TLS).
    # View captured OTP/notification emails at http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    # Dev-only signing key. Long enough for HS512 so local tokens behave like
    # production ones. The prod profile has NO default and will refuse to boot
    # without a real JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-key-do-not-use-in-production-0123456789abcdef}
  cookie:
    secure: ${COOKIE_SECURE:false}   # false so cookies work over plain http://localhost
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  ratelimit:
    # Generous locally so repeated manual testing doesn't lock you out.
    # Production uses the much tighter defaults from application.yml.
    otp-per-hour: ${RATELIMIT_OTP_PER_HOUR:100}
    login-per-15min: ${RATELIMIT_LOGIN_PER_15MIN:100}
    ai-per-hour: ${RATELIMIT_AI_PER_HOUR:100}
