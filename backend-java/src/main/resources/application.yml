spring:
  application:
    name: SkillSwapBackend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Short on purpose: a rate-limit check sits on the login hot path, so a
      # hung Redis must fail fast to the in-memory fallback rather than stall
      # every request behind it.
      timeout: 1s
      connect-timeout: 1s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Correct client IPs behind a reverse proxy / load balancer. Without this,
  # rate limiting would bucket every request under the proxy's IP.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      # Tied to whether Redis is actually in use. The starter is always on the
      # classpath, and its health indicator would otherwise report the whole
      # application DOWN for failing to reach a Redis that this deployment
      # deliberately does not run -- taking healthy instances out of a load
      # balancer over an optional dependency.
      enabled: ${REDIS_ENABLED:false}

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
  admin:
    # Existing account to grant ADMIN on startup. Blank disables the check.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  mail:
    # The visible sender. With an SMTP relay this must be an address the
    # provider has verified -- it is NOT the same as MAIL_USERNAME, which is a
    # credential rather than a mailbox.
    from: ${MAIL_FROM:noreply@skillswap.local}
    from-name: ${MAIL_FROM_NAME:SkillSwap}
  redis:
    # Share rate-limit buckets and WebSocket fan-out across API instances.
    # Required before scaling past one replica; pointless below that.
    enabled: ${REDIS_ENABLED:false}
  ratelimit:
    # Requests allowed per window, per client IP.
    otp-per-hour: ${RATELIMIT_OTP_PER_HOUR:5}
    login-per-15min: ${RATELIMIT_LOGIN_PER_15MIN:10}
    # Low on purpose. Gemini's free tier allows only ~20 generate requests per
    # day per model for the whole project, so a generous per-user limit lets one
    # person drain the entire day's allowance in minutes and leaves the feature
    # dead for everyone else. Raise this once on a paid plan.
    ai-per-hour: ${RATELIMIT_AI_PER_HOUR:5}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    # Pinned, and chosen by measurement rather than by picking the newest.
    #
    # Two failure modes were observed against a real free-tier key: retired ids
    # return 404 permanently (this is how gemini-2.0-flash broke), and the
    # newest ids are heavily rate-limited (gemini-3.7-flash returned 429 on 4 of
    # 5 calls, the `-latest` alias 503 on 2 of 5). gemini-3.5-flash answered 5
    # of 5. Newest is not most available.
    #
    # This id will eventually be retired too; the symptom is a 404 naming the
    # model in the logs, and the fix is to bump this after re-checking
    # availability against your own key.
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  # Levels only; the output FORMAT lives in logback-spring.xml (readable
  # console lines in dev, JSON per line in prod).
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.skillswap.backend: ${LOG_LEVEL_APP:INFO}
